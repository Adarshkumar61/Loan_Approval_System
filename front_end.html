<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Loan Approval System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== PAGE BACKGROUND ===== */
body {
    margin: 0;
    min-height: 100vh;
    background: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
}

/* Optional blurred background image */
.bg {
    position: fixed;
    inset: 0;
    background: url("/static/bg.jpg") center / cover no-repeat;
    filter: blur(14px);
    opacity: 0.35;
    z-index: -1;
}

/* ===== MAIN CARD ===== */
.card {
    width: 100%;
    max-width: 460px;
    background: rgba(2, 6, 23, 0.88);
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}

/* ===== HEADER / PROFILE ===== */
.profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #78f5c9, #238bd0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 22px;
}

.profile small {
    opacity: 0.75;
}

h2 {
    text-align: center;
    margin-bottom: 16px;
}

/* ===== FORM ELEMENTS ===== */
label {
    font-size: 14px;
    margin-top: 12px;
    display: block;
    opacity: 0.85;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
}

input:focus, select:focus {
    outline: 2px solid #38bdf8;
}

/* ===== BUTTON ===== */
button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: white;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

/* ===== RESULT ===== */
.result {
    margin-top: 18px;
    padding: 14px;
    border-radius: 14px;
    text-align: center;
    display: none;
    font-weight: bold;
}

.approved {
    background: #16a34a;
}

.rejected {
    background: #dc2626;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="card">

    <div class="profile">
        <div class="avatar">A</div>
        <div>
            <strong>Hii <b>Adarsh</b> 😊</strong><br>
            <small>AI Loan Approval System</small>
        </div>
    </div>

    <h2>Loan Approval Prediction</h2>

    <!-- ===== INPUTS MATCHING REAL DATASET ===== -->

    <label>City</label>
    <input id="city" type="text" placeholder="Enter city name">

    <label>Monthly Income</label>
    <input id="income" type="number" placeholder="e.g. 50000">

    <label>Credit Score</label>
    <input id="credit_score" type="number" placeholder="e.g. 650">

    <label>Loan Amount</label>
    <input id="loan_amount" type="number" placeholder="e.g. 200000">

    <label>Years Employed</label>
    <input id="years_employed" type="number" placeholder="e.g. 5">

    <label>Points</label>
    <input id="points" type="number" step="0.1" placeholder="e.g. 45.5">

    <button onclick="predict()">Check Loan Status</button>

    <div id="result" class="result"></div>

</div>

<script>
function predict() {
    const resultBox = document.getElementById("result");

    const payload = {
        city: document.getElementById("city").value.trim(),
        income: Number(document.getElementById("income").value),
        credit_score: Number(document.getElementById("credit_score").value),
        loan_amount: Number(document.getElementById("loan_amount").value),
        years_employed: Number(document.getElementById("years_employed").value),
        points: Number(document.getElementById("points").value)
    };

    // Basic validation
    for (let key in payload) {
        if (payload[key] === "" || Number.isNaN(payload[key])) {
            alert("Please fill all fields correctly.");
            return;
        }
    }

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        resultBox.style.display = "block";
        resultBox.className =
            "result " + (data.loan_status === "Approved" ? "approved" : "rejected");

        resultBox.innerHTML = `
            ${data.loan_status}<br>
            Confidence: ${data.confidence}%
        `;
    })
    .catch(err => {
        console.error(err);
        alert("Server error. Please try again.");
    });
}
</script>

</body>
</html>
